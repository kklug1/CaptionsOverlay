<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Captions, Audio Recorder & Transcript</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --success-hover: #059669;
      --info: #0284c7;
      --info-hover: #0369a1;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-sub);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-sizing: border-box;
      display: inline-block;
      text-decoration: none;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      background-color: #475569;
      cursor: not-allowed;
      transform: none;
    }

    .download-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-audio {
      background-color: var(--success);
    }
    .btn-audio:hover {
      background-color: var(--success-hover);
    }

    .btn-text {
      background-color: var(--info);
    }
    .btn-text:hover {
      background-color: var(--info-hover);
    }

    .status-box {
      margin-top: 1.5rem;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.875rem;
      color: var(--text-sub);
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Live Captions & Suite</h1>
    <p>Launch an always-on-top caption overlay while capturing full audio and text transcriptions.</p>

    <button id="launchBtn" class="btn">Launch Overlay & Record</button>

    <div id="downloadGroup" class="download-group" style="display: none;">
      <a id="downloadAudioBtn" class="btn btn-audio" download="session-audio.webm">Download Audio (.webm)</a>
      <a id="downloadTextBtn" class="btn btn-text" download="session-transcript.txt">Download Transcript (.txt)</a>
    </div>

    <div id="statusBox" class="status-box">Ready to start.</div>
  </div>

  <script>
    const launchBtn = document.getElementById('launchBtn');
    const downloadGroup = document.getElementById('downloadGroup');
    const downloadAudioBtn = document.getElementById('downloadAudioBtn');
    const downloadTextBtn = document.getElementById('downloadTextBtn');
    const statusBox = document.getElementById('statusBox');

    let recognition = null;
    let pipWindow = null;
    let isPipActive = false;

    // Recording and Transcript Storage
    let mediaRecorder = null;
    let audioChunks = [];
    let audioStream = null;
    let fullTranscript = '';

    window.addEventListener('DOMContentLoaded', () => {
      const hasPiP = 'documentPictureInPicture' in window;
      const hasSpeech = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;

      if (!hasPiP || !hasSpeech) {
        launchBtn.disabled = true;
        statusBox.style.color = '#ef4444';
        statusBox.textContent = 'Unsupported browser. Please use Chrome or Edge on desktop.';
      }
    });

    launchBtn.addEventListener('click', async () => {
      if (isPipActive && pipWindow) {
        pipWindow.close();
        return;
      }

      try {
        statusBox.style.color = '#94a3b8';
        statusBox.textContent = 'Requesting microphone & opening window...';
        downloadGroup.style.display = 'none';
        fullTranscript = '';

        // 1. Capture Microphone Audio
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(audioStream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          // Audio Blob creation
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          downloadAudioBtn.href = URL.createObjectURL(audioBlob);

          // Text Transcript Blob creation
          const textBlob = new Blob([fullTranscript.trim() || 'No speech recorded.'], { type: 'text/plain' });
          downloadTextBtn.href = URL.createObjectURL(textBlob);

          // Reveal download buttons
          downloadGroup.style.display = 'flex';
          
          if (audioStream) {
            audioStream.getTracks().forEach(track => track.stop());
          }
        };

        mediaRecorder.start();

        // 2. Open Picture-in-Picture window
        pipWindow = await documentPictureInPicture.requestWindow({
          width: 700,
          height: 120,
        });

        isPipActive = true;
        launchBtn.textContent = 'Stop Session & Save Files';
        launchBtn.style.backgroundColor = '#dc2626';

        // 3. Build PiP Overlay UI
        const pipDoc = pipWindow.document;
        pipDoc.body.style.margin = '0';
        pipDoc.body.style.background = '#0a0a0a';
        pipDoc.body.style.display = 'flex';
        pipDoc.body.style.alignItems = 'center';
        pipDoc.body.style.justifyContent = 'center';
        pipDoc.body.style.height = '100vh';
        pipDoc.body.style.overflow = 'hidden';

        const captionBox = pipDoc.createElement('div');
        captionBox.style.cssText = `
          width: 100%;
          max-height: 2.6em;
          padding: 0 20px;
          box-sizing: border-box;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 32px;
          font-weight: 700;
          line-height: 1.3;
          text-align: center;
          color: #facc15;
          text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
          overflow: hidden;
          word-wrap: break-word;
        `;
        captionBox.textContent = 'Listening & Recording...';
        pipDoc.body.appendChild(captionBox);

        // 4. Initialize Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onresult = (event) => {
          let interimTranscript = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcriptChunk = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              fullTranscript += transcriptChunk + ' ';
            } else {
              interimTranscript += transcriptChunk;
            }
          }

          captionBox.textContent = interimTranscript || 'Listening...';
          captionBox.scrollTop = captionBox.scrollHeight;
        };

        recognition.onend = () => {
          if (isPipActive && pipWindow && !pipWindow.closed) {
            try {
              recognition.start();
            } catch (e) {}
          }
        };

        // Handle Session End
        pipWindow.addEventListener('pagehide', () => {
          isPipActive = false;
          
          if (recognition) {
            recognition.stop();
          }

          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }

          launchBtn.textContent = 'Launch Overlay & Record';
          launchBtn.style.backgroundColor = '#2563eb';
          statusBox.textContent = 'Session finished! Download your audio and transcript below.';
        });

        recognition.start();
        statusBox.textContent = 'Live overlay, audio recording, and transcript active!';

      } catch (err) {
        isPipActive = false;
        statusBox.style.color = '#ef4444';
        statusBox.textContent = 'Launch failed: ' + err.message;
      }
    });
  </script>
</body>
</html>
